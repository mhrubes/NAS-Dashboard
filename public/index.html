<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domácí rozcestník</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --ok:#16a34a; --off:#9ca3af; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#e8eaed; --muted:#9aa0a6; --line:#2b2f37; --accent:#5b8def; --ok:#4ade80; --off:#6b7280; --bad:#f0605d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  [hidden] { display:none !important; }
  main { max-width:1000px; margin:0 auto; padding:32px 16px 48px; }
  button, input { font:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:7px 14px; cursor:pointer; transition:filter .15s; }
  button:hover { filter:brightness(1.12); }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button.danger { background:var(--bad); }
  button:focus-visible, input:focus-visible, a.card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:20px; }
  h1 { margin:0; font-size:28px; }
  .sub { color:var(--muted); margin-top:4px; }
  h2 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0; }
  .ghead { display:flex; align-items:center; gap:8px; margin:28px 0 12px; }
  .ghead h2 { margin-right:auto; }
  .ghead button { padding:3px 9px; font-size:13px; }
  button:disabled { opacity:.4; cursor:default; filter:none; }

  #bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; margin-bottom:8px; background:color-mix(in srgb, var(--accent) 12%, var(--card)); border:1px solid var(--accent); border-radius:10px; }
  #bar strong { margin-right:auto; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
  a.card { position:relative; display:flex; flex-direction:column; gap:8px; padding:18px; background:var(--card); border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none; transition:transform .15s, border-color .15s, box-shadow .15s; }
  a.card:hover { transform:translateY(-2px); border-color:var(--accent); box-shadow:0 8px 24px rgba(0,0,0,.12); }
  .top { display:flex; align-items:center; gap:12px; }
  .icon { font-size:30px; line-height:1; }
  .name { font-size:18px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--off); flex:none; }
  .dot.on { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .dot.off { background:var(--bad); }
  .desc { color:var(--muted); font-size:14px; }
  .url { color:var(--accent); font-size:12px; word-break:break-all; margin-top:auto; }
  .tools { display:flex; gap:6px; margin-top:6px; }
  .tools button { padding:3px 9px; font-size:13px; }
  .card.add { align-items:center; justify-content:center; min-height:140px; border-style:dashed; color:var(--accent); font-weight:600; cursor:pointer; }
  .err { color:var(--bad); padding:16px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  footer { margin-top:36px; color:var(--muted); font-size:12px; }

  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--text); padding:0; width:min(92vw, 440px); box-shadow:0 20px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background:rgba(0,0,0,.5); backdrop-filter:blur(3px); }
  dialog[open] { animation:pop .15s ease-out; }
  @keyframes pop { from { opacity:0; transform:translateY(8px) scale(.97); } }
  dialog form { padding:22px; display:grid; gap:12px; }
  dialog h3 { margin:0; font-size:18px; }
  #dlgText { margin:0; color:var(--muted); word-break:break-word; }
  .fld { display:grid; gap:4px; font-size:13px; color:var(--muted); }
  .combo { position:relative; }
  .clist { position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:5; margin:0; padding:4px; list-style:none; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.35); max-height:180px; overflow:auto; }
  .clist li { padding:7px 10px; border-radius:6px; cursor:pointer; color:var(--text); font-size:14px; }
  .clist li:hover, .clist li.active { background:color-mix(in srgb, var(--accent) 22%, transparent); }
  .clist li.new { color:var(--muted); font-style:italic; }
  .fld input, .fld select { padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); width:100%; font-size:15px; }
  .fld small { font-size:12px; }
  .chk { display:flex; align-items:center; gap:8px; font-size:14px; }
  .dlgErr { color:var(--bad); font-size:14px; min-height:1.2em; }
  .dlgActions { display:flex; justify-content:flex-end; gap:8px; }

  #ring { position:fixed; left:16px; bottom:16px; width:60px; height:60px; border-radius:50%; background:var(--card); border:1px solid var(--line); box-shadow:0 6px 20px rgba(0,0,0,.25); display:grid; place-items:center; z-index:10; cursor:default; }
  #ring svg { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  #ring circle { fill:none; stroke-width:3; }
  #ring .bg { stroke:var(--line); }
  #ring .fg { stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .9s linear, stroke .3s; }
  #ring.warn .fg { stroke:#f59e0b; }
  #ring.danger .fg { stroke:var(--bad); }
  #ringText { position:relative; font-size:13px; font-variant-numeric:tabular-nums; font-weight:600; }
  #ring.danger #ringText { color:var(--bad); }
  #toasts { position:fixed; right:16px; bottom:16px; display:grid; gap:8px; z-index:10; max-width:calc(100vw - 32px); }
  .toast { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); padding:10px 16px; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; transform:translateY(8px); transition:.25s; }
  .toast.show { opacity:1; transform:none; }
  .toast.error { border-left-color:var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="title">Domácí rozcestník</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <button class="ghost" id="editBtn" title="Upravit seznam aplikací">✎ Upravit</button>
  </header>

  <div id="bar" hidden>
    <strong>Režim úprav</strong>
    <button id="addBtn">+ Přidat aplikaci</button>
    <button class="ghost" id="titleBtn">Nadpis</button>
    <button class="ghost" id="doneBtn">Hotovo</button>
    <button class="ghost" id="logoutBtn">Odhlásit</button>
  </div>

  <div id="content"></div>
  <footer>Odkazy s <code>{host}</code> se otevřou na stejné adrese, přes kterou stránku vidíš (IP nebo název NASu).</footer>
</main>

<dialog id="dlg">
  <form id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText" hidden></p>
    <div id="dlgFields" style="display:grid;gap:12px"></div>
    <div class="dlgErr" id="dlgErr"></div>
    <div class="dlgActions">
      <button type="button" class="ghost" id="dlgCancel">Zrušit</button>
      <button type="submit" id="dlgOk">Uložit</button>
    </div>
  </form>
</dialog>
<div id="ring" hidden title="Automatické odhlášení za nečinnost. Pohyb myší nebo psaní čas obnoví.">
  <svg viewBox="0 0 44 44" aria-hidden="true">
    <circle class="bg" cx="22" cy="22" r="19"></circle>
    <circle class="fg" id="ringFg" cx="22" cy="22" r="19"></circle>
  </svg>
  <span id="ringText" role="timer" aria-live="off"></span>
</div>
<div id="toasts"></div>

<script>
const $ = (id) => document.getElementById(id);
const HOST = location.hostname || 'localhost';
const fill = (u) => String(u || '').split('{host}').join(HOST);
const isHttp = (u) => /^https?:\/\//i.test(u);

let data = { title: '', subtitle: '', apps: [] };
let authed = false;
let editMode = false;
let cards = [];

// --- automaticke odhlaseni pri necinnosti (jako v bankovnich aplikacich) ---
// Odpocet se pocita z casove znacky (deadline), ne z poctu tiku, takze je presny i v neaktivni zalozce.
// Aktivita (mys, klavesnice, dotyk, scroll) odpocet vrati na plnou hodnotu; prepnuti jinam ho neresetuje.
const RING_CIRC = 2 * Math.PI * 19;
const KEEPALIVE_EVERY_MS = 10000;
let timeoutMs = 0;
let deadline = 0;
let lastKeepalive = 0;
let tickTimer = null;

function startSession(timeoutSec, remainingSec) {
  timeoutMs = timeoutSec * 1000;
  deadline = Date.now() + remainingSec * 1000;
  lastKeepalive = Date.now();
  $('ring').hidden = false;
  if (!tickTimer) tickTimer = setInterval(tick, 1000);
  tick();
}

function endSession() {
  clearInterval(tickTimer); tickTimer = null;
  $('ring').hidden = true;
}

function tick() {
  if (!authed) return;
  const left = deadline - Date.now();
  if (left <= 0) { sessionExpired(); return; }
  const s = Math.ceil(left / 1000);
  $('ringText').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  $('ringFg').style.strokeDasharray = RING_CIRC;
  $('ringFg').style.strokeDashoffset = RING_CIRC * (1 - Math.min(1, left / timeoutMs));
  $('ring').classList.toggle('warn', left <= 30000 && left > 10000);
  $('ring').classList.toggle('danger', left <= 10000);
}

function sessionExpired() {
  authed = false; editMode = false;
  endSession();
  if ($('dlg').open) $('dlgCancel').click(); // rozepsany formular se zavre
  render();
  api('/api/logout', { method: 'POST', body: '{}' }).catch(() => {});
  toast('Byl jsi odhlášen z důvodu nečinnosti', 'error');
}

function onActivity() {
  if (!authed) return;
  const now = Date.now();
  if (now >= deadline) return; // vyprsela, rozhodne tick()
  deadline = now + timeoutMs;
  if (now - lastKeepalive >= KEEPALIVE_EVERY_MS) { // server obnovime nejvyse jednou za 10 s
    lastKeepalive = now;
    api('/api/keepalive', { method: 'POST', body: '{}' }).catch((err) => { if (err.status === 401) sessionExpired(); });
  }
}
for (const ev of ['mousemove', 'mousedown', 'keydown', 'touchstart', 'wheel', 'scroll']) {
  window.addEventListener(ev, onActivity, { passive: true, capture: true });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

// --- API ---
async function api(url, opts = {}) {
  const res = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(body.error || res.statusText); e.status = res.status; throw e; }
  return body;
}

async function save(next) {
  try {
    data = await api('/api/apps', { method: 'PUT', body: JSON.stringify(next) });
  } catch (err) {
    if (err.status === 401) { authed = false; editMode = false; endSession(); render(); toast('Platnost přihlášení vypršela', 'error'); }
    throw err;
  }
  render();
}

function toast(msg, type = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  $('toasts').append(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, type === 'error' ? 5000 : 2200);
}

// --- naseptavac: klik/focus ukaze existujici hodnoty, psani filtruje, neexistujici text = nova hodnota ---
const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); // "sit" najde "Síť"

function attachCombo(wrap, inp, all) {
  const box = document.createElement('div'); box.className = 'combo';
  const list = document.createElement('ul'); list.className = 'clist'; list.hidden = true;
  const status = document.createElement('small');
  box.append(inp, list);
  wrap.append(box, status);
  inp.autocomplete = 'off';

  let items = [];
  let active = -1;

  const updateStatus = () => {
    const v = inp.value.trim();
    status.textContent = !v ? 'Prázdné pole = bez skupiny'
      : all.includes(v) ? 'Existující skupina'
      : `Vytvoří se nová skupina „${v}“`;
  };

  const highlight = () => {
    [...list.children].forEach((li, i) => li.classList.toggle('active', i === active));
    list.children[active]?.scrollIntoView({ block: 'nearest' });
  };

  const hide = () => { list.hidden = true; active = -1; };

  const choose = (g) => {
    inp.value = g;
    inp.dispatchEvent(new Event('input', { bubbles: true })); // prepocita zavisla pole (pozice)
    hide();
  };

  // showAll: pri kliknuti/focusu vsechny moznosti, pri psani jen odpovidajici
  const render = (showAll) => {
    const v = inp.value.trim();
    const q = norm(v);
    items = showAll || !q ? all.slice() : all.filter((g) => norm(g).includes(q));
    list.textContent = '';
    items.forEach((g) => {
      const li = document.createElement('li');
      li.textContent = g;
      li.onmousedown = (e) => { e.preventDefault(); choose(g); }; // mousedown, aby input neztratil focus driv
      list.append(li);
    });
    if (v && !all.includes(v)) {
      const li = document.createElement('li');
      li.className = 'new'; li.textContent = `＋ Nová skupina „${v}“`;
      li.onmousedown = (e) => { e.preventDefault(); hide(); };
      list.append(li);
    }
    active = -1;
    list.hidden = list.children.length === 0;
  };

  inp.addEventListener('focus', () => render(true));
  inp.addEventListener('click', () => render(true));
  inp.addEventListener('input', () => { updateStatus(); render(false); });
  inp.addEventListener('blur', hide);
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (list.hidden) { render(true); return; }
      if (!items.length) return;
      active = e.key === 'ArrowDown' ? Math.min(active + 1, items.length - 1) : Math.max(active - 1, 0);
      highlight();
    } else if (e.key === 'Enter' && !list.hidden && active >= 0) {
      e.preventDefault(); choose(items[active]);
    } else if (e.key === 'Escape' && !list.hidden) {
      e.preventDefault(); e.stopPropagation(); hide(); // zavre jen seznam, ne cely dialog
    }
  });
  updateStatus();
}

// --- jednotny dialog s formularem; onSubmit muze vyhodit chybu (zobrazi se, dialog zustane) ---
function openForm({ title, text, fields = [], okText = 'Uložit', danger = false, onSubmit }) {
  const dlg = $('dlg'), form = $('dlgForm'), ok = $('dlgOk');
  $('dlgTitle').textContent = title;
  $('dlgText').textContent = text || ''; $('dlgText').hidden = !text;
  $('dlgErr').textContent = '';
  ok.textContent = okText; ok.className = danger ? 'danger' : ''; ok.disabled = false;

  const box = $('dlgFields'); box.textContent = '';
  const inputs = {};
  for (const f of fields) {
    const wrap = document.createElement('label');
    wrap.className = f.type === 'checkbox' ? 'chk' : 'fld';
    const span = document.createElement('span'); span.textContent = f.label;
    const isSelect = f.type === 'select';
    const inp = document.createElement(isSelect ? 'select' : 'input');
    inp.name = f.key;
    if (!isSelect) { inp.type = f.type || 'text'; inp.autocomplete = 'off'; }
    if (f.type === 'checkbox') inp.checked = !!f.value; else if (!isSelect) inp.value = f.value ?? '';
    if (f.placeholder) inp.placeholder = f.placeholder;
    if (f.maxLength) inp.maxLength = f.maxLength;
    if (f.required) inp.required = true;
    if (f.type === 'checkbox') wrap.append(inp, span); else wrap.append(span, inp);
    if (f.type === 'combo') attachCombo(wrap, inp, f.options);
    if (f.hint) { const s = document.createElement('small'); s.textContent = f.hint; wrap.append(s); }
    box.append(wrap);
    inputs[f.key] = inp;
  }

  // select (napr. pozice) se dopocitava z ostatnich poli a prepocita se pri zmene polí z dependsOn
  const selects = fields.filter((f) => f.type === 'select');
  const readValues = () => {
    const v = {};
    for (const f of fields) {
      if (f.type === 'checkbox') v[f.key] = inputs[f.key].checked;
      else if (f.type === 'select') v[f.key] = Number(inputs[f.key].value);
      else v[f.key] = inputs[f.key].value.trim();
    }
    return v;
  };
  const refreshSelect = (f) => {
    const spec = f.build(readValues());
    const sel = inputs[f.key];
    sel.textContent = '';
    for (const o of spec.options) {
      const opt = document.createElement('option');
      opt.value = String(o.value); opt.textContent = o.label; sel.append(opt);
    }
    sel.value = String(spec.value);
  };
  selects.forEach(refreshSelect);
  box.oninput = (e) => { for (const f of selects) if ((f.dependsOn || []).includes(e.target.name)) refreshSelect(f); };

  return new Promise((resolve) => {
    let done = false;
    const close = (result) => { if (done) return; done = true; dlg.close(); resolve(result); };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const values = readValues();
      ok.disabled = true; $('dlgErr').textContent = '';
      try { if (onSubmit) await onSubmit(values); close(true); }
      catch (err) { $('dlgErr').textContent = err.message; ok.disabled = false; }
    };
    $('dlgCancel').onclick = () => close(false);
    dlg.oncancel = (e) => { e.preventDefault(); close(false); }; // Esc
    dlg.onclick = (e) => { if (e.target === dlg) close(false); }; // klik na pozadi
    dlg.showModal();
    const first = box.querySelector('input'); if (first) first.focus(); else ok.focus();
  });
}

// --- dostupnost aplikaci ---
function probe(url) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 2500);
  return fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
    .then(() => true, () => false)
    .finally(() => clearTimeout(t));
}

async function checkAll() {
  await Promise.all(cards.filter((c) => c.check && isHttp(c.url)).map(async (c) => {
    const ok = await probe(c.url);
    c.dot.className = 'dot ' + (ok ? 'on' : 'off');
    c.dot.title = ok ? 'Běží' : 'Nedostupná';
  }));
}

// --- vykresleni ---
function btn(label, cls, onClick) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label; if (cls) b.className = cls;
  b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); onClick(); };
  return b;
}

function buildCard(app, index) {
  const url = fill(app.url);
  const a = document.createElement('a');
  a.className = 'card';
  a.rel = 'noopener';
  if (editMode) { a.href = '#'; a.onclick = (e) => { e.preventDefault(); editApp(index); }; }
  else a.href = isHttp(url) ? url : '#';

  const top = document.createElement('div'); top.className = 'top';
  const icon = document.createElement('div'); icon.className = 'icon'; icon.textContent = app.icon || '🔗';
  const name = document.createElement('div'); name.className = 'name'; name.textContent = app.name;
  const dot = document.createElement('span'); dot.className = 'dot'; dot.title = 'Stav neznámý';
  top.append(icon, name);
  if (app.check !== false) top.append(dot);

  const desc = document.createElement('div'); desc.className = 'desc'; desc.textContent = app.description || '';
  const link = document.createElement('div'); link.className = 'url'; link.textContent = url;
  a.append(top, desc, link);

  if (editMode) {
    const tools = document.createElement('div'); tools.className = 'tools';
    tools.append(
      btn('Upravit', 'ghost', () => editApp(index)),
      btn('↑', 'ghost', () => moveApp(index, -1)),
      btn('↓', 'ghost', () => moveApp(index, 1)),
      btn('Smazat', 'ghost', () => deleteApp(index)),
    );
    a.append(tools);
  }
  cards.push({ dot, url, check: app.check !== false });
  return a;
}

function render() {
  document.title = data.title || 'Domácí rozcestník';
  $('title').textContent = data.title || 'Domácí rozcestník';
  $('subtitle').textContent = data.subtitle || '';
  $('bar').hidden = !editMode;
  $('editBtn').hidden = editMode;

  const content = $('content'); content.textContent = '';
  cards = [];

  const groups = new Map();
  data.apps.forEach((app, i) => {
    const g = app.group || '';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push({ app, i });
  });

  const order = [...groups.keys()];
  order.forEach((group, gi) => {
    const items = groups.get(group);
    if (group || editMode) {
      const head = document.createElement('div'); head.className = 'ghead';
      const h = document.createElement('h2'); h.textContent = group || 'Bez skupiny';
      head.append(h);
      if (editMode) {
        const up = btn('↑', 'ghost', () => moveGroup(group, -1)); up.disabled = gi === 0; up.title = 'Posunout celou skupinu nahoru';
        const down = btn('↓', 'ghost', () => moveGroup(group, 1)); down.disabled = gi === order.length - 1; down.title = 'Posunout celou skupinu dolů';
        head.append(up, down);
        if (group) head.append(btn('Přejmenovat', 'ghost', () => renameGroup(group)));
      }
      content.append(head);
    }
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const { app, i } of items) grid.append(buildCard(app, i));
    content.append(grid);
  });

  if (editMode) {
    const grid = document.createElement('div'); grid.className = 'grid'; grid.style.marginTop = '16px';
    const add = document.createElement('a'); add.className = 'card add'; add.href = '#'; add.textContent = '+ Přidat aplikaci';
    add.onclick = (e) => { e.preventDefault(); addApp(); };
    grid.append(add); content.append(grid);
  }
  if (!data.apps.length && !editMode) {
    const d = document.createElement('div'); d.className = 'err'; d.style.color = 'var(--muted)';
    d.textContent = 'Zatím tu nejsou žádné aplikace. Klikni na „Upravit“ a přidej první.';
    content.append(d);
  }
  checkAll();
}

// --- uprava ---
// existujici skupiny v poradi prvniho vyskytu (bez prazdne)
function existingGroups() {
  const out = [];
  for (const a of data.apps) { const g = a.group || ''; if (g && !out.includes(g)) out.push(g); }
  return out;
}

// moznosti pozice v ramci skupiny: 0 = na zacatek, n = na konec (oldIndex = upravovana polozka, -1 = nova)
function positionOptions(group, oldIndex) {
  const g = group || '';
  const others = data.apps.filter((a, i) => i !== oldIndex && (a.group || '') === g);
  const options = [];
  if (!others.length) {
    options.push({ value: 0, label: 'První v této skupině' });
  } else {
    others.forEach((a, k) => options.push({
      value: k,
      label: k === 0 ? `Na začátek (před „${a.name}“)` : `Za „${others[k - 1].name}“, před „${a.name}“`,
    }));
    options.push({ value: others.length, label: `Na konec (za „${others[others.length - 1].name}“)` });
  }
  let value = others.length; // nova polozka: na konec
  if (oldIndex >= 0 && (data.apps[oldIndex].group || '') === g) {
    value = data.apps.slice(0, oldIndex).filter((a) => (a.group || '') === g).length; // zustane na svem miste
  }
  return { options, value };
}

// vlozi polozku na pozici pos v ramci skupiny (ostatni se posunou), stara pozice se uvolni
function placeApp(apps, app, oldIndex, pos) {
  const list = apps.slice();
  if (oldIndex >= 0) list.splice(oldIndex, 1);
  const g = app.group || '';
  const idxs = [];
  list.forEach((a, i) => { if ((a.group || '') === g) idxs.push(i); });
  let at;
  if (!idxs.length) at = list.length;
  else if (pos < idxs.length) at = idxs[Math.max(0, pos)];
  else at = idxs[idxs.length - 1] + 1;
  list.splice(at, 0, app);
  return list;
}

const appFields = (a = {}, oldIndex = -1) => [
  { key: 'name', label: 'Název', value: a.name, required: true, maxLength: 60 },
  { key: 'description', label: 'Popis', value: a.description, maxLength: 300 },
  { key: 'url', label: 'URL', value: a.url, required: true, maxLength: 300, placeholder: 'http://{host}:3000', hint: 'Místo IP použij {host}, nahradí se adresou NASu.' },
  { key: 'icon', label: 'Ikona (emoji)', value: a.icon, maxLength: 8, placeholder: '📦' },
  { key: 'group', label: 'Skupina', type: 'combo', value: a.group ?? '', maxLength: 40,
    options: existingGroups(), placeholder: 'Vyber ze seznamu nebo napiš novou' },
  { key: 'position', label: 'Pozice ve skupině', type: 'select', dependsOn: ['group'], build: (v) => positionOptions(v.group, oldIndex) },
  { key: 'check', label: 'Zobrazovat stav (zelená/červená tečka)', type: 'checkbox', value: a.check !== false },
];

const withList = (fn) => { const next = structuredClone(data); next.apps = fn(next.apps); return next; };
const withApps = (fn) => withList((apps) => { fn(apps); return apps; });

async function addApp() {
  await openForm({
    title: 'Přidat aplikaci', fields: appFields(), okText: 'Přidat',
    onSubmit: async ({ position, ...app }) => { await save(withList((apps) => placeApp(apps, app, -1, position))); toast('Aplikace přidána'); },
  });
}

async function editApp(i) {
  await openForm({
    title: 'Upravit aplikaci', fields: appFields(data.apps[i], i),
    onSubmit: async ({ position, ...app }) => { await save(withList((apps) => placeApp(apps, app, i, position))); toast('Uloženo'); },
  });
}

async function deleteApp(i) {
  await openForm({
    title: 'Smazat aplikaci?', text: `„${data.apps[i].name}“ bude odebrána z rozcestníku. Samotná aplikace zůstane na NASu beze změny.`,
    okText: 'Smazat', danger: true,
    onSubmit: async () => { await save(withApps((apps) => apps.splice(i, 1))); toast('Smazáno'); },
  });
}

// presun cele skupiny: poradi skupin = poradi prvniho vyskytu, pole se slozi podle noveho poradi
async function moveGroup(group, dir) {
  const order = [];
  for (const a of data.apps) { const g = a.group || ''; if (!order.includes(g)) order.push(g); }
  const i = order.indexOf(group);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  try { await save(withList((apps) => order.flatMap((g) => apps.filter((a) => (a.group || '') === g)))); }
  catch (err) { toast(err.message, 'error'); }
}

async function renameGroup(group) {
  await openForm({
    title: 'Přejmenovat skupinu', okText: 'Přejmenovat',
    fields: [{ key: 'name', label: 'Název skupiny', value: group, maxLength: 40 }],
    onSubmit: async (v) => {
      await save(withList((apps) => apps.map((a) => ((a.group || '') === group ? { ...a, group: v.name } : a))));
      toast('Skupina přejmenována');
    },
  });
}

// presun v ramci stejne skupiny (prohodi se se sousedem)
async function moveApp(i, dir) {
  const g = data.apps[i].group || '';
  let j = i + dir;
  while (j >= 0 && j < data.apps.length && (data.apps[j].group || '') !== g) j += dir;
  if (j < 0 || j >= data.apps.length) return;
  try { await save(withApps((apps) => { [apps[i], apps[j]] = [apps[j], apps[i]]; })); }
  catch (err) { toast(err.message, 'error'); }
}

$('titleBtn').onclick = () => openForm({
  title: 'Nadpis stránky',
  fields: [
    { key: 'title', label: 'Nadpis', value: data.title, required: true, maxLength: 100 },
    { key: 'subtitle', label: 'Podnadpis', value: data.subtitle, maxLength: 200 },
  ],
  onSubmit: async (v) => { const next = structuredClone(data); next.title = v.title; next.subtitle = v.subtitle; await save(next); toast('Uloženo'); },
});

$('editBtn').onclick = async () => {
  if (!authed) {
    const ok = await openForm({
      title: 'Přihlášení', okText: 'Přihlásit',
      fields: [{ key: 'password', label: 'Heslo', type: 'password', required: true }],
      onSubmit: async (v) => {
        const r = await api('/api/login', { method: 'POST', body: JSON.stringify({ password: v.password }) });
        authed = true; startSession(r.timeoutSec, r.remainingSec);
      },
    });
    if (!ok) return;
  }
  editMode = true; render();
};
$('doneBtn').onclick = () => { editMode = false; render(); };
$('addBtn').onclick = addApp;
$('logoutBtn').onclick = async () => {
  await api('/api/logout', { method: 'POST', body: '{}' }).catch(() => {});
  authed = false; editMode = false; endSession(); render();
};

async function init() {
  try {
    data = await api('/api/apps');
  } catch (err) {
    const d = document.createElement('div'); d.className = 'err';
    d.textContent = 'Nepodařilo se načíst seznam aplikací: ' + err.message;
    $('content').append(d);
    return;
  }
  const me = await api('/api/me').catch(() => null);
  authed = !!me;
  if (me) startSession(me.timeoutSec, me.remainingSec);
  render();
  setInterval(checkAll, 30000);
}
init();
</script>
</body>
